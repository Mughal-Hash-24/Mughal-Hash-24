<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 486" width="1180" height="486" role="img" aria-labelledby="tt dd"><title id="tt">Five domains of work</title><desc id="dd">Agentic systems, knowledge and retrieval, NLP research, systems and embedded, graph and classical AI, around a core habit: model the problem, then check the model.</desc><style>path,circle{animation-duration:9.0s;animation-iteration-count:infinite;animation-timing-function:linear}
@keyframes sp0{
  0%,0.25s%{stroke-dashoffset:1;opacity:0}
  0.30%{opacity:1}
  18%{stroke-dashoffset:0;opacity:1}
  100%{stroke-dashoffset:0;opacity:1}}
@keyframes sp1{
  0%,0.34s%{stroke-dashoffset:1;opacity:0}
  0.30%{opacity:1}
  27%{stroke-dashoffset:0;opacity:1}
  100%{stroke-dashoffset:0;opacity:1}}
@keyframes sp2{
  0%,0.43s%{stroke-dashoffset:1;opacity:0}
  0.30%{opacity:1}
  36%{stroke-dashoffset:0;opacity:1}
  100%{stroke-dashoffset:0;opacity:1}}
@keyframes sp3{
  0%,0.52s%{stroke-dashoffset:1;opacity:0}
  0.30%{opacity:1}
  45%{stroke-dashoffset:0;opacity:1}
  100%{stroke-dashoffset:0;opacity:1}}
@keyframes sp4{
  0%,0.61s%{stroke-dashoffset:1;opacity:0}
  0.30%{opacity:1}
  54%{stroke-dashoffset:0;opacity:1}
  100%{stroke-dashoffset:0;opacity:1}}
@keyframes core{
  0%,2%{stroke-dashoffset:1;opacity:0} 4%{opacity:1}
  40%{stroke-dashoffset:0;opacity:1} 100%{stroke-dashoffset:0;opacity:1}}
.sp0{animation-name:sp0}.sp1{animation-name:sp1}.sp2{animation-name:sp2}.sp3{animation-name:sp3}.sp4{animation-name:sp4}.core{animation-name:core}@media (prefers-reduced-motion: reduce){path,circle{animation:none !important}stroke-dashoffset:0 !important;opacity:1 !important}}</style><rect width="1180" height="486" rx="12" fill="#0E0C16"/>
